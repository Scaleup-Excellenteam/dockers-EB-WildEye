version: '3.8'

services:
  router:
    build: ./router
    ports:
      - "5004:5000"
    networks:
      - code-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  python-executor:
    build: ./python-executor
    networks:
      - code-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - router

  java-executor:
    build: ./java-executor
    ports:
      - "5002:5002"
    networks:
      - code-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - router

  dart-executor:
    build: ./dart-executor
    ports:
      - "5003:5003"
    networks:
      - code-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - router

  client:
    build: ./client
    ports:
      - "5005:5005"
    networks:
      - code-net
    depends_on:
      - router
      - python-executor
      - java-executor
      - dart-executor
    restart: unless-stopped

networks:
  code-net:
    driver: bridge